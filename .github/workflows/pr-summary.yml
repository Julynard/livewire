name: Codex PR Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} > pr.diff

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenAI SDK
        run: npm install openai

      - name: Summarize PR using Codex
        id: summarize
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const OpenAI = require('openai');

          const openai = new OpenAI({
            apiKey: process.env.OPENAI_API_KEY
          });

          const diff = fs.readFileSync('pr.diff', 'utf8');

          async function run() {
            const res = await openai.responses.create({
              model: "gpt-5-codex",
              input: `
              Summarize this Laravel Pull Request for a mixed audience of developers and non-developers.

              Write in clear, plain English and avoid unnecessary jargon.
              If a technical term is needed, briefly explain it in simple language.

              Use this exact structure:
              1) What This PR Does (Non-Technical)
                 - 3-6 bullets explaining user/business impact in plain language.
              2) Why It Matters
                 - 2-4 bullets describing the problem solved or improvement delivered.
              3) Developer Notes
                 - Business Logic Changes
                 - Database Changes
                 - API/Contract Changes
                 - Risks Introduced
                 - Test Focus Areas
              4) Rollout / Reviewer Checklist
                 - 3-6 actionable checks reviewers can run through quickly.

              Keep it concise and scannable. Prefer bullets over long paragraphs.
              If a section has no changes, write "None".

              PR Diff:
              ${diff}
              `
            });

            fs.writeFileSync('summary.txt', res.output[0].content[0].text);
          }

          run();
          EOF

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.txt', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Codex PR Summary\n\n${body}`
            });
